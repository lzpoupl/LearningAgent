# LearningAgent 配置示例。
#
# 发布版会读取可执行文件同目录下的 config.toml；开发时读取工作目录下的
# config.toml。文件缺失或某个键缺失时，均回落到内置默认值。

[anki.scheduler]
# 当前启用的调度算法（算法切换），新卡将使用该算法：sm2 或 fsrs。
algorithm = "sm2"
# 学习阶段各作答等级对应的复习延时（分钟）。
learning_again_minutes = 1
learning_hard_minutes = 6
learning_good_minutes = 10

[ui]
# 界面皮肤模式：light（浅色）、dark（深色）、system（跟随操作系统深浅色）。
theme = "system"
